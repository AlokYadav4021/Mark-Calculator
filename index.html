<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark-sheet Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
    <div class="center">
        <table>
            <tr>
                <td>Hindi</td>
                <td><input type="number" name="" id="Hindi"></td>
            </tr>
            <tr>
                <td>English</td>
                <td><input type="number" name="" id="English"></td>
            </tr>
            <tr>
                <td>Maths</td>
                <td><input type="number" name="" id="Maths"></td>
            </tr>
            <tr>
                <td>Science</td>
                <td><input type="number" name="" id="Science"></td>
            </tr>
            <tr>
                <td>Art</td>
                <td><input type="number" name="" id="Art"></td>
            </tr>
            <tr>
                <td>Computer</td>
                <td><input type="number" name="" id="Computer"></td>
            </tr>
            <tr>
                <td>Total</td>
                <td id="Total"></td>
            </tr>
            <tr>
                <td>Percentage</td>
                <td id="Percentage"></td>
            </tr>
            <tr>
                <td>Grade</td>
                <td id="Grade"></td>
            </tr>
            <tr>
                <td></td>
                <td><button>Calculate</button></td>
            </tr>
        </table>
    </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
